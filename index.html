  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Replace only the Hero profile initials with the uploaded profile photo.
      const replaceProfileInitials = () => {
        const target = document.querySelector('span.text-7xl');
        if (!target || target.dataset.profilePhotoApplied) return;
        target.dataset.profilePhotoApplied = 'true';
        target.textContent = '';
        target.style.display = 'block';
        target.style.width = '100%';
        target.style.height = '100%';
        const img = document.createElement('img');
        img.src = '/rayhan-profile.jpg';
        img.alt = 'Rayhan Ahmed';
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.objectPosition = 'center';
        target.appendChild(img);
      };
      const profileObserver = new MutationObserver(replaceProfileInitials);
      profileObserver.observe(document.getElementById('root'), { childList: true, subtree: true });
      window.addEventListener('load', replaceProfileInitials);
    </script>
  </body>
